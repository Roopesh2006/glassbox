name: GlassBox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (zero external deps)
        run: pip install -e .
      - name: Run falsification & integration test suite
        run: python -m unittest discover -s tests -v
      - name: Verify pre-recorded demo cassettes
        run: |
          glassbox verify demo-data/lethal_trifecta_github.gbx
          glassbox verify demo-data/prod_db_wipe_freeze.gbx
          glassbox verify demo-data/mcp_rugpull_schema.gbx
      - name: Smoke test 30-second keyless demo
        run: glassbox demo --out-dir /tmp/gbx-ci-demo
